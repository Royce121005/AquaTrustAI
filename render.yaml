# ==============================================================
# AquaTrust AI - Render Infrastructure-as-Code Blueprint
# Provisions: Managed PostgreSQL 17 + FastAPI ASGI Web Service
# ==============================================================
databases:
  - name: aquatrust-postgres
    databaseName: aquatrust_db
    user: aquatrust_user
    plan: free # or starter for 24/7 persistent disk
    region: oregon
    postgresMajorVersion: 16

services:
  - type: web
    name: aquatrust-backend
    env: python
    region: oregon
    plan: free # or starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "AquaTrust AI Backend"
      - key: APP_ENV
        value: "production"
      - key: DEBUG
        value: "false"
      - key: API_V1_STR
        value: "/api/v1"
      - key: DATABASE_URL
        fromDatabase:
          name: aquatrust-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: "INFO"
      - key: LOG_FORMAT
        value: "json"
