# AquaTrust AI — Anomaly Detection Feature Definition
# Version: 2.2.1
# Authoritative specification for Isolation Forest anomaly detection feature vectors

version: "2.2.1"
last_updated: "2026-09-27T11:30:00Z"
target_model: "IsolationForest"
learning_paradigm: "unsupervised"

core_parameters:
  - parameter_slug: "bod"
    canonical_name: "Biochemical Oxygen Demand"
    unit: "mg/L"
    description: "Amount of dissolved oxygen consumed by biological organisms decomposing organic matter."
    physical_range: [0.0, 5000.0]
    typical_ranges:
      inlet: [100.0, 1000.0]
      primary_effluent: [80.0, 600.0]
      final_effluent: [2.0, 50.0]

  - parameter_slug: "cod"
    canonical_name: "Chemical Oxygen Demand"
    unit: "mg/L"
    description: "Measure of capacity of water to consume oxygen during chemical oxidation."
    physical_range: [0.0, 15000.0]
    typical_ranges:
      inlet: [200.0, 2500.0]
      primary_effluent: [150.0, 1500.0]
      final_effluent: [10.0, 150.0]

  - parameter_slug: "tss"
    canonical_name: "Total Suspended Solids"
    unit: "mg/L"
    description: "Dry-weight of suspended particles trapped by a filter."
    physical_range: [0.0, 10000.0]
    typical_ranges:
      inlet: [100.0, 2000.0]
      primary_effluent: [50.0, 500.0]
      final_effluent: [2.0, 50.0]

  - parameter_slug: "ph"
    canonical_name: "pH"
    unit: "pH_units"
    description: "Logarithmic scale of hydrogen ion activity."
    physical_range: [0.0, 14.0]
    typical_ranges:
      inlet: [6.0, 9.0]
      primary_effluent: [6.5, 8.5]
      final_effluent: [6.5, 8.5]

  - parameter_slug: "nh4_n"
    canonical_name: "Ammoniacal Nitrogen"
    unit: "mg/L"
    description: "Nitrogen present in the form of ammonium ion (NH4+) and unionized ammonia (NH3)."
    physical_range: [0.0, 500.0]
    typical_ranges:
      inlet: [10.0, 100.0]
      final_effluent: [0.1, 10.0]

  - parameter_slug: "tn"
    canonical_name: "Total Nitrogen"
    unit: "mg/L"
    description: "Sum of all nitrogen forms (ammonia, organic nitrogen, nitrite, nitrate)."
    physical_range: [0.0, 1000.0]
    typical_ranges:
      inlet: [20.0, 150.0]
      final_effluent: [2.0, 20.0]

feature_vector:
  feature_names:
    - "value_t"
    - "delta_1"
    - "rolling_mean_3"
    - "rolling_std_3"
  
  feature_descriptions:
    value_t:
      name: "Current Observation"
      formula: "x_t"
      description: "Direct measurement value at timestamp t."
    delta_1:
      name: "First Difference"
      formula: "x_t - x_{t-1}"
      description: "Rate of change / step-derivative from immediately preceding observation."
    rolling_mean_3:
      name: "Trailing 3-Period Rolling Mean"
      formula: "mean(x_t, x_{t-1}, x_{t-2})"
      description: "Short-term moving average capturing immediate local level."
    rolling_std_3:
      name: "Trailing 3-Period Rolling Standard Deviation"
      formula: "std(x_t, x_{t-1}, x_{t-2}, ddof=1)"
      description: "Short-term sample dispersion capturing local operational volatility."

stream_identity:
  format: "dataset_id:facility_id:measurement_stage:parameter"
  description: "Deterministic logical time-series stream identifier ensuring streams are never cross-contaminated."

insufficient_data_policy:
  min_history_required: 3
  first_observations_flag: true
  description: "Observations at t=0 and t=1 lack 3 historical observations. They are marked with quality_status='insufficient_data' and insufficient_data=True. Features are set to NaN and NEVER silently zero-imputed."

missing_value_policy:
  imputation_strategy: "none"
  action: "preserve_nan"
  description: "If an observation value_t is missing (NaN), delta_1, rolling_mean_3, and rolling_std_3 evaluate to NaN. The observation receives quality_status='missing_input' and insufficient_data=True."

scaling_policy:
  method: "StandardScaler"
  formula: "z = (x - mean_train) / std_train"
  fitting_scope: "Train partition only (strictly prevents temporal lookahead leakage)"
  parameters_saved: true

dataset_eligibility:
  DATASET_01_UCI_WATER_TREATMENT:
    status: "ELIGIBLE"
    stream_type: "multivariate_multi_stage_daily"
    total_observations: 527
    eligible_parameters:
      - "ph" (PH-E, PH-P, PH-D, PH-S)
      - "bod" (DBO-E, DBO-P, DBO-D, DBO-S)
      - "cod" (DQO-E, DQO-D, DQO-S)
      - "tss" (SS-E, SS-P, SS-D, SS-S)
    unavailable_parameters:
      - "nh4_n"
      - "tn"
    notes: "Continuous daily time series across 4 plant treatment stages."

  DATASET_02_MELBOURNE_ETP_INLET:
    status: "ELIGIBLE"
    stream_type: "univariate_daily_influent"
    total_observations: 1382
    eligible_parameters:
      - "nh4_n" (nh4_n_mg_l)
      - "bod" (bod_mg_l)
      - "cod" (cod_mg_l)
      - "tn" (tn_mg_l)
      - "nox_n" (nox_n_mg_l)
    unavailable_parameters:
      - "ph"
      - "tss"
    notes: "Continuous daily time series of raw wastewater influent from 2014 to 2019."

  DATASET_03_MELBOURNE_ETP_OUTLET:
    status: "ELIGIBLE"
    stream_type: "univariate_daily_effluent"
    total_observations: 1716
    eligible_parameters:
      - "cod" (cod_mg_l)
      - "bod" (bod_mg_l)
      - "nh4_n" (nh4_n_mg_l)
      - "tn" (tn_mg_l)
      - "nox_n" (nox_n_mg_l)
      - "tkn" (tkn_mg_l)
    unavailable_parameters:
      - "ph"
      - "tss"
    notes: "Continuous daily time series of treated final effluent from 2014 to 2019."

  DATASET_04_CPCB_UP_STP:
    status: "INELIGIBLE_FOR_TIME_SERIES_SPLIT"
    stream_type: "cross_sectional_spatial_snapshot"
    total_observations: 125
    eligible_parameters:
      - "ph"
      - "bod"
      - "cod"
      - "tss"
      - "nh4_n"
      - "tn"
    unavailable_parameters: []
    notes: "Cross-sectional snapshot of 125 separate physical facilities in December 2023. Contains exactly 1 sample per facility; ineligible for temporal lag and rolling autoregressive feature engineering."
