version: '3.8'

networks:
  aquatrust-net:
    name: aquatrust-net
    driver: bridge

volumes:
  orderer.aquatrust.com:
  peer0.facility.aquatrust.com:
  couchdb.facility:
  peer0.auditor.aquatrust.com:
  couchdb.auditor:
  peer0.regulator.aquatrust.com:
  couchdb.regulator:

services:
  # ---------------------------------------------------------
  # ORDERER NODE
  # ---------------------------------------------------------
  orderer.aquatrust.com:
    image: hyperledger/fabric-orderer:${FABRIC_VERSION:-2.5.9}
    container_name: orderer.aquatrust.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ./crypto-config/ordererOrganizations/orderer.aquatrust.com/orderers/orderer.aquatrust.com/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/orderer.aquatrust.com/orderers/orderer.aquatrust.com/tls:/var/hyperledger/orderer/tls
      - orderer.aquatrust.com:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "7053:7053"
    networks:
      - aquatrust-net

  # ---------------------------------------------------------
  # FACILITY ORG (Plant Operators)
  # ---------------------------------------------------------
  couchdb.facility:
    image: couchdb:3.3.2
    container_name: couchdb.facility
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "5984:5984"
    volumes:
      - couchdb.facility:/opt/couchdb/data
    networks:
      - aquatrust-net

  peer0.facility.aquatrust.com:
    image: hyperledger/fabric-peer:${FABRIC_VERSION:-2.5.9}
    container_name: peer0.facility.aquatrust.com
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=aquatrust-net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.facility.aquatrust.com
      - CORE_PEER_ADDRESS=peer0.facility.aquatrust.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.facility.aquatrust.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.facility.aquatrust.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.facility.aquatrust.com:7051
      - CORE_PEER_LOCALMSPID=FacilityMSP
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.facility:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/facility.aquatrust.com/peers/peer0.facility.aquatrust.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/facility.aquatrust.com/peers/peer0.facility.aquatrust.com/tls:/etc/hyperledger/fabric/tls
      - peer0.facility.aquatrust.com:/var/hyperledger/production
    ports:
      - "7051:7051"
    depends_on:
      - couchdb.facility
    networks:
      - aquatrust-net

  # ---------------------------------------------------------
  # AUDITOR ORG (Verification Authorities)
  # ---------------------------------------------------------
  couchdb.auditor:
    image: couchdb:3.3.2
    container_name: couchdb.auditor
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "6984:5984"
    volumes:
      - couchdb.auditor:/opt/couchdb/data
    networks:
      - aquatrust-net

  peer0.auditor.aquatrust.com:
    image: hyperledger/fabric-peer:${FABRIC_VERSION:-2.5.9}
    container_name: peer0.auditor.aquatrust.com
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=aquatrust-net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.auditor.aquatrust.com
      - CORE_PEER_ADDRESS=peer0.auditor.aquatrust.com:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.auditor.aquatrust.com:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.auditor.aquatrust.com:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.auditor.aquatrust.com:8051
      - CORE_PEER_LOCALMSPID=AuditorMSP
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.auditor:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/auditor.aquatrust.com/peers/peer0.auditor.aquatrust.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/auditor.aquatrust.com/peers/peer0.auditor.aquatrust.com/tls:/etc/hyperledger/fabric/tls
      - peer0.auditor.aquatrust.com:/var/hyperledger/production
    ports:
      - "8051:8051"
    depends_on:
      - couchdb.auditor
    networks:
      - aquatrust-net

  # ---------------------------------------------------------
  # REGULATOR ORG (CPCB / SPCB Authorities)
  # ---------------------------------------------------------
  couchdb.regulator:
    image: couchdb:3.3.2
    container_name: couchdb.regulator
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "7984:5984"
    volumes:
      - couchdb.regulator:/opt/couchdb/data
    networks:
      - aquatrust-net

  peer0.regulator.aquatrust.com:
    image: hyperledger/fabric-peer:${FABRIC_VERSION:-2.5.9}
    container_name: peer0.regulator.aquatrust.com
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=aquatrust-net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.regulator.aquatrust.com
      - CORE_PEER_ADDRESS=peer0.regulator.aquatrust.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.regulator.aquatrust.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.regulator.aquatrust.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.regulator.aquatrust.com:9051
      - CORE_PEER_LOCALMSPID=RegulatorMSP
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.regulator:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/regulator.aquatrust.com/peers/peer0.regulator.aquatrust.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/regulator.aquatrust.com/peers/peer0.regulator.aquatrust.com/tls:/etc/hyperledger/fabric/tls
      - peer0.regulator.aquatrust.com:/var/hyperledger/production
    ports:
      - "9051:9051"
    depends_on:
      - couchdb.regulator
    networks:
      - aquatrust-net
