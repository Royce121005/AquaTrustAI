services:
  orderer0.aquatrust.internal:
    image: hyperledger/fabric-orderer:${FABRIC_VERSION:?set FABRIC_VERSION}
    container_name: aquatrust-orderer0

    environment:
      FABRIC_LOGGING_SPEC: INFO

      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp

      ORDERER_GENERAL_BOOTSTRAPMETHOD: file
      ORDERER_GENERAL_BOOTSTRAPFILE: /var/hyperledger/orderer/orderer.genesisblock

      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"

      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:9447
      ORDERER_METRICS_PROVIDER: prometheus

    command: orderer

    ports:
      - "7050:7050"
      - "9443:9443"
      - "9447:9447"

    volumes:
      - ./organizations/ordererOrganizations/aquatrust.internal/orderers/orderer0.aquatrust.internal/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/aquatrust.internal/orderers/orderer0.aquatrust.internal/tls:/var/hyperledger/orderer/tls
      - ./artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesisblock:ro
      - orderer-data:/var/hyperledger/production/orderer

    networks:
      - aquatrust


  peer0.facility.aquatrust.internal:
    image: hyperledger/fabric-peer:${FABRIC_VERSION:?set FABRIC_VERSION}
    container_name: aquatrust-peer0-facility

    environment: &peer-common
      FABRIC_LOGGING_SPEC: INFO

      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: aquatrust-fabric

      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_PROFILE_ENABLED: "false"

      CORE_PEER_GOSSIP_USELEADERELECTION: "true"
      CORE_PEER_GOSSIP_ORGLEADER: "false"
      CORE_PEER_GOSSIP_BOOTSTRAP: ""

      CORE_PEER_MSPCONFIGPATH: /var/hyperledger/fabric/msp

      CORE_PEER_TLS_CERT_FILE: /var/hyperledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /var/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /var/hyperledger/fabric/tls/ca.crt

      CORE_PEER_FILESYSTEMPATH: /var/hyperledger/production

      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9444
      CORE_METRICS_PROVIDER: prometheus

      CORE_PEER_ADDRESS: peer0.facility.aquatrust.internal:7051
      CORE_PEER_LOCALMSPID: FacilityMSP
      CORE_PEER_ID: peer0.facility.aquatrust.internal
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051

      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.facility.aquatrust.internal:7051

    command: peer node start

    ports:
      - "7051:7051"
      - "9444:9444"

    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/facility.aquatrust.internal/peers/peer0.facility.aquatrust.internal/msp:/var/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/facility.aquatrust.internal/peers/peer0.facility.aquatrust.internal/tls:/var/hyperledger/fabric/tls
      - ./organizations/peerOrganizations/facility.aquatrust.internal:/var/hyperledger/fabric/organizations/facility
      - ./artifacts:/var/hyperledger/fabric/artifacts
      - facility-peer-data:/var/hyperledger/production

    networks:
      aquatrust:
        aliases:
          - peer0.facility.aquatrust.internal


  peer0.auditor.aquatrust.internal:
    image: hyperledger/fabric-peer:${FABRIC_VERSION:?set FABRIC_VERSION}
    container_name: aquatrust-peer0-auditor

    environment:
      <<: *peer-common

      CORE_PEER_ADDRESS: peer0.auditor.aquatrust.internal:8051
      CORE_PEER_LOCALMSPID: AuditorMSP
      CORE_PEER_ID: peer0.auditor.aquatrust.internal
      CORE_PEER_LISTENADDRESS: 0.0.0.0:8051

      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:8052
      CORE_PEER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9445

      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.auditor.aquatrust.internal:8051

    command: peer node start

    ports:
      - "8051:8051"
      - "9445:9445"

    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/auditor.aquatrust.internal/peers/peer0.auditor.aquatrust.internal/msp:/var/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/auditor.aquatrust.internal/peers/peer0.auditor.aquatrust.internal/tls:/var/hyperledger/fabric/tls
      - ./organizations/peerOrganizations/auditor.aquatrust.internal:/var/hyperledger/fabric/organizations/auditor
      - ./artifacts:/var/hyperledger/fabric/artifacts
      - auditor-peer-data:/var/hyperledger/production

    networks:
      aquatrust:
        aliases:
          - peer0.auditor.aquatrust.internal


  peer0.regulator.aquatrust.internal:
    image: hyperledger/fabric-peer:${FABRIC_VERSION:?set FABRIC_VERSION}
    container_name: aquatrust-peer0-regulator

    environment:
      <<: *peer-common

      CORE_PEER_ADDRESS: peer0.regulator.aquatrust.internal:9051
      CORE_PEER_LOCALMSPID: RegulatorMSP
      CORE_PEER_ID: peer0.regulator.aquatrust.internal
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051

      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9446

      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.regulator.aquatrust.internal:9051

    command: peer node start

    ports:
      - "9051:9051"
      - "9446:9446"

    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/regulator.aquatrust.internal/peers/peer0.regulator.aquatrust.internal/msp:/var/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/regulator.aquatrust.internal/peers/peer0.regulator.aquatrust.internal/tls:/var/hyperledger/fabric/tls
      - ./organizations/peerOrganizations/regulator.aquatrust.internal:/var/hyperledger/fabric/organizations/regulator
      - ./artifacts:/var/hyperledger/fabric/artifacts
      - regulator-peer-data:/var/hyperledger/production

    networks:
      aquatrust:
        aliases:
          - peer0.regulator.aquatrust.internal


  fabric-gateway:
    build:
      context: ../fabric-client
      dockerfile: Dockerfile

    container_name: aquatrust-fabric-gateway

    environment:
      FABRIC_BRIDGE_HOST: 0.0.0.0
      FABRIC_BRIDGE_PORT: 8099
      FABRIC_BRIDGE_TOKEN: ${FABRIC_BRIDGE_TOKEN:?set FABRIC_BRIDGE_TOKEN in dlt/network/.env}

      FABRIC_MSP_ID: ${FABRIC_MSP_ID:-FacilityMSP}
      FABRIC_PEER_ENDPOINT: ${FABRIC_PEER_ENDPOINT:-peer0.facility.aquatrust.internal:7051}
      FABRIC_PEER_HOST_ALIAS: ${FABRIC_PEER_HOST_ALIAS:-}

      FABRIC_CHANNEL_NAME: ${FABRIC_CHANNEL_NAME:-aquatrust-channel}
      FABRIC_CHAINCODE_NAME: ${FABRIC_CHAINCODE_NAME:-aquatrust-records}

      FABRIC_TLS_CERT_PATH: ${FABRIC_TLS_CERT_PATH:-/crypto/facility/peers/peer0.facility.aquatrust.internal/tls/ca.crt}
      FABRIC_CERT_PATH: ${FABRIC_CERT_PATH:-/crypto/facility/users/User1@facility.aquatrust.internal/msp/signcerts/User1@facility.aquatrust.internal-cert.pem}
      FABRIC_PRIVATE_KEY_PATH: ${FABRIC_PRIVATE_KEY_PATH:-/crypto/facility/users/User1@facility.aquatrust.internal/msp/keystore}

    ports:
      - "127.0.0.1:8099:8099"

    volumes:
      - ./organizations/peerOrganizations/facility.aquatrust.internal:/crypto/facility:ro

    depends_on:
      - orderer0.aquatrust.internal
      - peer0.facility.aquatrust.internal
      - peer0.auditor.aquatrust.internal
      - peer0.regulator.aquatrust.internal

    networks:
      - aquatrust


networks:
  aquatrust:
    name: aquatrust-fabric
    driver: bridge


volumes:
  orderer-data:
  facility-peer-data:
  auditor-peer-data:
  regulator-peer-data:
