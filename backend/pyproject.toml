[project]
name = "aquatrust-backend"
version = "0.1.0"
description = "AquaTrust AI Backend Foundation"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
